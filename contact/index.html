<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | breathe.io</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="../index.html">breathe</a></li>
        <li><a href="../types/index.html">types</a></li>
        <li><a href="../history/index.html">history</a></li>
        <li><a href="./index.html">contact</a></li>
      </ul>
    </nav>

    <main>
      <h1>say hello</h1>
      <h2>share a thought, a question, or one thing you're grateful for today.</h2>

      <form class="contact-form" action="https://formspree.io/f/mnpjerae" method="POST">
        <label for="name">name</label>
        <input id="name" name="name" type="text" required />

        <label for="email">email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">message</label>
        <textarea id="message" name="message" required></textarea>

        <input type="hidden" name="subject" value="New note from: {{name}}" />

        <button type="submit">send</button>
      </form>
    </main>
  </body>
</html>
